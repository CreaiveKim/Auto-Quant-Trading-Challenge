services:
  quant-trading:
    build:
      context: .
      dockerfile: Dockerfile
    image: quant-trading:latest
    container_name: quant-trading
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 4g
    cpus: 1.5
